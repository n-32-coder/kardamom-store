# RBAC: least-privilege ServiceAccount for the app pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kardamom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kardamom
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kardamom
subjects:
  - kind: ServiceAccount
    name: kardamom
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: kardamom
