# OpenShift Route: public HTTPS URL for the store (replaces Ingress on OpenShift).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kardamom
  namespace: kardamom
spec:
  to:
    kind: Service
    name: kardamom
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
