name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/kardamom

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      KARDAMOM_ADMIN_PASSWORD: ci-admin-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Migrate
        run: python manage.py migrate --noinput
      - name: Django check
        run: python manage.py check
      - name: Seed demo data
        run: python seed_kardamom.py
      - name: Build real catalogue
        run: python rebuild_catalogue.py
      - name: Seed demo customer
        run: python make_demo_user.py
      - name: Smoke tests
        run: |
          python verify_kardamom.py
          python verify_cart.py
          python verify_full.py
          python verify_pay.py
      - name: Feature tests
        run: |
          python verify_catalogue.py
          python verify_dashboard.py
          python verify_manage.py
          python verify_admin_spec.py
          python verify_adminfix.py
          python verify_spec2.py
          python verify_rolenav.py
          python verify_customer.py
          python verify_gift.py
          python verify_premium_photo.py
          python verify_powder_photo.py
          python verify_seeds_photo.py
          python verify_loginpage.py
          python verify_registerpage.py
          python verify_email_identity.py

  image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push container image to GHCR (container registry)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}

  # deploy:
