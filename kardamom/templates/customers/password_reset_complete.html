{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete - KARDAMOM{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card text-center">
        <img src="{% static 'images/logo.png' %}" alt="KARDAMOM" class="auth-logo">
        <h2 class="serif">Password updated</h2>
        <p class="section-sub">Your password is reset. Head back to log in with your new one.</p>
        <a href="{% url 'login' %}" class="btn-premium mt-3">Log in</a>
    </div>
</div>
{% endblock %}
