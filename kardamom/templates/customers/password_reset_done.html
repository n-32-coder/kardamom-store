{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Done - KARDAMOM{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card text-center">
        <img src="{% static 'images/logo.png' %}" alt="KARDAMOM" class="auth-logo">
        <h2 class="serif">Check your inbox</h2>
        <p class="section-sub">If an account with that email exists, we've sent a reset link. It expires in a few minutes.</p>
        <a href="{% url 'login' %}" class="btn-premium mt-3">Back to Login</a>
    </div>
</div>
{% endblock %}
