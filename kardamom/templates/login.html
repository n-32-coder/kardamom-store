{% extends "base.html" %}
{% load static %}

{% block title %}Login - KARDAMOM{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <img src="{% static 'images/logo.png' %}" alt="KARDAMOM" class="auth-logo">
        <h2 class="serif">Welcome back</h2>
        <p class="section-sub">Log in to your spice shelf.</p>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="field">
                <label for="id_username">Email</label>
                <input type="email" name="username" id="id_username" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-premium w-100">Log In</button>
        </form>
        <p class="mt-3 section-sub">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
