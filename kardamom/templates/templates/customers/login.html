{% extends "base.html" %}

{% block title %}Login - KARDAMOM{% endblock %}

{% block content %}
<div class="section-title">Login</div>
<form method="post" class="checkout-section" style="max-width:480px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-premium">Login</button>
</form>
<p class="mt-3">No account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
