{% extends "base.html" %}

{% block title %}Register - KARDAMOM{% endblock %}

{% block content %}
<div class="section-title">Create Account</div>
<form method="post" class="checkout-section" style="max-width:480px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-premium">Register</button>
</form>
<p class="mt-3">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
