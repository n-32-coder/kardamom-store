{% extends "base.html" %}

{% block title %}Delete {{ product.name }} - KARDAMOM{% endblock %}

{% block content %}
<div class="section-title">Delete Product</div>
<div class="checkout-section" style="max-width:520px;">
    <p>Delete <strong>{{ product.name }}</strong> ({{ product.get_pack_size_display }}) permanently? Its reviews and images go with it.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-premium">Yes, delete</button>
        <a href="{% url 'product_manage_list' %}" class="btn-premium-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
